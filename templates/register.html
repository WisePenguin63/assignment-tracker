{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    {% if error %}
        <p class="error bg-danger text-white"><strong>Error:</strong> {{ error }}</p>
    {% endif %}
    <h1>Register</h1><br>


    <div class="d-flex justify-content-center text-center">
        <form method="post" action="/register" style="max-width: 400px; width: 100%">
            <div class="mb-3 form-floating">
                <input type="email" id="email" class="form-control mx-auto"   name="email" placeholder="Email" autocomplete="email">
                <label for="email">Email</label>
            </div>
            <div class="mb-3 form-floating">
                <input type="password" id="password" class="form-control mx-auto" required name="password" placeholder="Password" autocomplete="new-password">
                <label for="password">Password</label>
            </div>
            <div class="mb-3 form-floating">
                <input type="password" id="password2" class="form-control mx-auto" required name="password2" placeholder="Password" autocomplete="new-password">
                <label for="password2">Re-enter password</label>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
{% endblock %}
