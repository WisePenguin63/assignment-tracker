{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
    <h1>Login</h1><br>

    <div class="d-flex justify-content-center text-center">
        <form method="post" action="/login" style="max-width: 400px; width: 100%">
            <div class="mb-3 form-floating">

                <input type="email" id="email" class="form-control mx-auto" required name="email" placeholder="Email" autocomplete="email">
                <label for="email">Email</label>
            </div>
            <div class="mb-3 form-floating">
                <input type="password" id="password" class="form-control mx-auto" required name="password" placeholder="Password" autocomplete="current-password">
                <label for="password">Password</label>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
{% endblock %}
